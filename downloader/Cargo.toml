[package]
name = "downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
compact_str = { version = "0.10.0", default-features = false, features = ["serde"] }
futures-util = { version = "0.3.34", default-features = false }
num_cpus = "1.17.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false, features = ["fs", "macros", "rt-multi-thread"] }
url = { version = "2.5.8", default-features = false }
